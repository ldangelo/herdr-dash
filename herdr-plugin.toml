id = "ldangelo.herdr-dash"
name = "herdr-dash"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open gh-dash in a popup over your workspace, in the folder of the focused pane"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "gh-dash: open popup"
contexts = ["workspace", "pane"]
command = ["/bin/sh", "scripts/open.sh"]

[[panes]]
id = "dash"
title = "gh-dash"
placement = "popup"
width = "90%"
height = "90%"
command = ["/bin/sh", "scripts/run-dash.sh"]
